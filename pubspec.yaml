# Role: Declares Flutter package metadata and dependencies for the to-do portfolio app.
name: to_do_flutter
description: A polished portfolio to-do app built with Flutter and Provider.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.5.4
  purchases_flutter: ^10.0.0
  fl_chart: ^0.69.0
  google_mobile_ads: ^5.1.0
  flutter_animate: ^4.5.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/velo_logo.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/velo_logo.png"

flutter_native_splash:
  color: "#0A0A0A"
  image: "assets/velo_logo.png"
  fullscreen: true
  android_12:
    image: "assets/velo_logo.png"
    icon_background_color: "#0A0A0A"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
