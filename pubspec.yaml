# Role: Declares Flutter package metadata and dependencies for the to-do portfolio app.
name: to_do_flutter
description: A polished portfolio to-do app built with Flutter and Provider.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.5.4
  purchases_flutter: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
